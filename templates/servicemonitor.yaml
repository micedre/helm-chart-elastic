{{/*
NOTE: Elasticsearch and Kibana do not natively expose Prometheus-format metrics.
The endpoints /_cluster/health and /api/status return JSON, not the Prometheus text
exposition format — Prometheus will reject them.

To collect real Elasticsearch metrics, deploy a dedicated exporter:
  https://github.com/prometheus-community/elasticsearch_exporter

Once deployed, create a ServiceMonitor targeting the exporter service instead.
This file is intentionally left empty until a proper exporter is wired in.
*/}}
