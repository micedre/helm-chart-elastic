{{- if .Values.networkPolicy.enabled }}
---
# Primary NetworkPolicy - allows ingress based on 'from' rules and restricts egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
  egress:
    # Allow DNS resolution
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
    # Allow inter-pod communication within the release (ES cluster transport + HTTP)
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
      - port: {{ .Values.elasticsearch.service.httpPort }}
        protocol: TCP
      - port: {{ .Values.elasticsearch.service.transportPort }}
        protocol: TCP
    # Allow Kubernetes API server access (needed by cert-gen job)
    - ports:
      - port: 443
        protocol: TCP
      - port: 6443
        protocol: TCP
{{- if .Values.networkPolicy.ingress }}
---
# Secondary NetworkPolicy - allows ingress from additional sources (e.g., ingress controller IPs)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-2
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress | nindent 8 }}
{{- end }}
{{- end }}
