{{- if .Values.elasticsearch.security.enabled }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-credentials" (include "elasticsearch.fullname" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "elasticsearch.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
type: Opaque
data:
  username: {{ "elastic" | b64enc | quote }}
  {{- if $existingSecret }}
  # Preserve existing password across upgrades
  password: {{ index $existingSecret.data "password" }}
  {{- else }}
  password: {{ include "elasticsearch.password" . | b64enc | quote }}
  {{- end }}
{{- end }}
