{{- if .Values.kibana.enabled }}
{{- $existingEncSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-encryption" (include "kibana.fullname" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kibana.fullname" . }}-encryption
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kibana.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existingEncSecret }}
  # Preserve existing keys to avoid breaking encrypted data
  encryptionKey: {{ index $existingEncSecret.data "encryptionKey" }}
  reportingKey: {{ index $existingEncSecret.data "reportingKey" }}
  securityKey: {{ index $existingEncSecret.data "securityKey" }}
  kibanaSystemPassword: {{ index $existingEncSecret.data "kibanaSystemPassword" | default (randAlphaNum 16 | b64enc) }}
  {{- else }}
  # Generate new keys on first install
  # These are base64-encoded 32-character random strings
  encryptionKey: {{ randAlphaNum 32 | b64enc | quote }}
  reportingKey: {{ randAlphaNum 32 | b64enc | quote }}
  securityKey: {{ randAlphaNum 32 | b64enc | quote }}
  # Dedicated password for the kibana_system built-in user (separate from elastic superuser)
  kibanaSystemPassword: {{ randAlphaNum 16 | b64enc | quote }}
  {{- end }}
{{- end }}

