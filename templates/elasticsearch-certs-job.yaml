{{- if and .Values.elasticsearch.security.enabled .Values.elasticsearch.security.tls.enabled .Values.elasticsearch.security.tls.useSelfSignedCerts }}
{{- if not .Values.elasticsearch.security.tls.certificatesSecret }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "elasticsearch.fullname" . }}-certs-gen
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "elasticsearch.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "elasticsearch.fullname" . }}-certs-sa
      containers:
      - name: generate-certs
        image: {{ .Values.elasticsearch.image.repository }}:{{ .Values.elasticsearch.image.tag }}
        command: ['sh', '-c']
        args:
        - |
          set -e
          CERTS_DIR=/tmp/certs
          mkdir -p ${CERTS_DIR}

          echo "Generating CA..."
          bin/elasticsearch-certutil ca --silent --pem -out /tmp/ca.zip
          unzip /tmp/ca.zip -d ${CERTS_DIR}

          echo "Generating wildcard node certificate..."
          bin/elasticsearch-certutil cert --silent --pem \
            --ca-cert ${CERTS_DIR}/ca/ca.crt \
            --ca-key ${CERTS_DIR}/ca/ca.key \
            --in /tmp/instances.yml \
            -out /tmp/certs.zip
          unzip /tmp/certs.zip -d ${CERTS_DIR}

          echo "Creating/updating Kubernetes secret via in-cluster API..."
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          KUBE_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          KUBE_NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
          KUBE_API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
          SECRET_NAME="{{ include "elasticsearch.fullname" . }}-certs"

          # Build secret JSON using Python (available in the ES image)
          # ca.key is intentionally excluded — it is only needed here during generation
          python3 - <<'PYEOF'
          import json, base64, os, sys

          certs_dir = os.environ.get('CERTS_DIR', '/tmp/certs')
          fullname = "{{ include "elasticsearch.fullname" . }}"

          def b64(path):
              with open(path, 'rb') as f:
                  return base64.b64encode(f.read()).decode()

          data = {
              'ca.crt':   b64(f'{certs_dir}/ca/ca.crt'),
              'node.crt': b64(f'{certs_dir}/{fullname}-node/{fullname}-node.crt'),
              'node.key': b64(f'{certs_dir}/{fullname}-node/{fullname}-node.key'),
          }

          secret = {
              'apiVersion': 'v1',
              'kind': 'Secret',
              'metadata': {
                  'name': os.environ['SECRET_NAME'],
                  'namespace': os.environ['KUBE_NS'],
              },
              'type': 'Opaque',
              'data': data,
          }
          with open('/tmp/secret.json', 'w') as f:
              json.dump(secret, f)
          print('Secret JSON written to /tmp/secret.json')
          PYEOF

          # Apply the secret (create or replace)
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            --cacert ${KUBE_CA} \
            -H "Authorization: Bearer ${KUBE_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST "${KUBE_API}/api/v1/namespaces/${KUBE_NS}/secrets" \
            -d @/tmp/secret.json)

          if [ "${HTTP_CODE}" = "201" ]; then
            echo "Secret ${SECRET_NAME} created successfully."
          elif [ "${HTTP_CODE}" = "409" ]; then
            echo "Secret ${SECRET_NAME} already exists, replacing..."
            HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
              --cacert ${KUBE_CA} \
              -H "Authorization: Bearer ${KUBE_TOKEN}" \
              -H "Content-Type: application/json" \
              -X PUT "${KUBE_API}/api/v1/namespaces/${KUBE_NS}/secrets/${SECRET_NAME}" \
              -d @/tmp/secret.json)
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "Secret ${SECRET_NAME} replaced successfully."
            else
              echo "ERROR: Failed to replace secret (HTTP ${HTTP_CODE}):"
              cat /tmp/resp.txt
              exit 1
            fi
          else
            echo "ERROR: Failed to create secret (HTTP ${HTTP_CODE}):"
            cat /tmp/resp.txt
            exit 1
          fi

          echo "Certificates generated and stored in secret ${SECRET_NAME}"
        env:
        - name: SECRET_NAME
          value: {{ include "elasticsearch.fullname" . }}-certs
        - name: KUBE_NS
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CERTS_DIR
          value: /tmp/certs
        volumeMounts:
        - name: cert-config
          mountPath: /tmp/instances.yml
          subPath: instances.yml
        {{- with .Values.elasticsearch.initContainers.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: cert-config
        configMap:
          name: {{ include "elasticsearch.fullname" . }}-cert-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "elasticsearch.fullname" . }}-certs-sa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "elasticsearch.fullname" . }}-certs-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "elasticsearch.fullname" . }}-certs-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
subjects:
- kind: ServiceAccount
  name: {{ include "elasticsearch.fullname" . }}-certs-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "elasticsearch.fullname" . }}-certs-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
